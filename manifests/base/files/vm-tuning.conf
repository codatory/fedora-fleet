# Kernel VM tuning for a workstation whose swap is zram, as Fedora Workstation's is.
#
# Installed by vm-tuning.yaml, which also loads it into the running kernel. As a file in
# /etc/sysctl.d it is read by systemd-sysctl at boot, so it survives reboots on its own.
#
# Syntax is `key = value`, one per line. sysctl rejects `key: value` in a config file and
# skips the line with a warning while still exiting 0, so a colon would quietly do nothing.
#
# Dirty writeback is bounded by bytes only. Each `*_bytes` knob is mutually exclusive with
# its `*_ratio` counterpart: writing either one zeroes the other in the kernel. Writing the
# ratio *after* the bytes therefore clears the byte limit: the handler for
# dirty_background_ratio zeroes dirty_background_bytes on every write, and dirty_ratio zeroes
# dirty_bytes whenever its value changes — which, at boot, it always does. That leaves both
# thresholds at zero and makes the kernel throttle at the first dirty page. The byte knobs
# are the explicit limits that are wanted here; each ratio then reads back as 0 by itself.

vm.swappiness = 100

# Retain inode/dentry metadata somewhat preferentially. Both knobs belong together: the
# ratio is meaningless without the denom it is compared against.
vm.vfs_cache_pressure = 50
vm.vfs_cache_pressure_denom = 100

# Give kswapd more runway so foreground allocations avoid direct reclaim: 1% of a zone,
# against a default of 0.1%.
vm.watermark_scale_factor = 100

# Preserve higher-order free blocks / repair fragmentation conservatively. The unit is
# 1/10000 of a zone's high watermark, so 300 is 3%, against a default of 150%.
vm.watermark_boost_factor = 300
vm.compaction_proactiveness = 10

# Try harder to keep pageblocks in order, recommended right after boot, since fragmentation
# that has already happened can be long-lasting.
vm.defrag_mode = 1

# Bound dirty memory with absolute limits rather than a percentage of RAM.
vm.dirty_background_bytes = 134217728
vm.dirty_bytes = 536870912

# Writeback timing: keep dirty data at most 30s, wake the flushers every 5s, and expire a
# lazytime inode after 12h.
vm.dirty_expire_centisecs = 3000
vm.dirty_writeback_centisecs = 500
vm.dirtytime_expire_seconds = 43200

# Swap readahead. The knob is logarithmic and 0 means one page — no readahead — against a
# default of 3 (eight pages): mm/swap_state.c computes `1 << page_cluster` and returns
# immediately when that is 1. Readahead exists to amortise seek cost, and swap on zram has no
# seek to amortise, so the batch only spends decompression on neighbouring pages that may
# never be faulted in.
vm.page-cluster = 0
