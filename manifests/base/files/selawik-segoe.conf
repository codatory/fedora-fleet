<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<!-- Selawik is Microsoft's own open replacement for Segoe UI, so it is the closest
	     substitute there is. Fedora's 45-latin.conf routes Segoe UI to `system-ui`, which
	     resolves to the desktop's own UI font, so without a rule here a document naming
	     Segoe UI keeps getting Adwaita Sans and Selawik is never selected.

	     A `match`/`edit` pair rather than an `alias`, because the rule has to hold for more
	     than one family name. `assign` rather than `prefer`: `prefer` only reorders
	     candidates already in the request, so it cannot pull in a font the application did
	     not name, and an `<alias>` holds a single family.

	     `assign` replaces the matched family, not the whole pattern, so an application that
	     asks for "Segoe UI, sans-serif" keeps its fallback for glyphs Selawik lacks — it
	     covers 348 codepoints and has no Cyrillic, Greek or CJK.

	     `binding="same"` rather than `weak`: a document that names Segoe UI means that
	     typeface, not merely a sans-serif.

	     "Segoe UI Webfont" is the family name Microsoft's own webfont kit declares in its
	     @font-face rules, so a page importing from there asks for a different family entirely
	     and needs its own rule. Segoe UI Historic and Segoe UI Symbol are separate Microsoft
	     families with no Selawik equivalent and are deliberately not claimed. -->
	<match target="pattern">
		<test qual="any" name="family">
			<string>Segoe UI</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Selawik</string>
		</edit>
	</match>

	<match target="pattern">
		<test qual="any" name="family">
			<string>Segoe UI Webfont</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Selawik</string>
		</edit>
	</match>
</fontconfig>
