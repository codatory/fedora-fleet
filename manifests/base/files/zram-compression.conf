# Installed by zram.yaml.
#
# zram-generator merges this section with the one in
# /usr/lib/systemd/zram-generator.conf from zram-generator-defaults, so the size stays
# Fedora's `min(ram, 8192)` and only the compressor is overridden here.
#
# lzo-rle is the kernel's default. lz4 compresses and decompresses faster at a somewhat
# lower ratio, which is the trade swap wants: the decompressor sits on the fault path, so
# its speed is a latency cost every time a page comes back, while a better ratio mostly
# buys a larger effective swap that is rarely filled.
[zram0]
compression-algorithm = lz4
